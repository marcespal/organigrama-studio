<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organigrama Studio — estructuras organizativas</title>
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#1c2430; --ink-soft:#5b6878; --line:#d3dae3;
  --accent:#1565c0; --accent-soft:#e3effb; --ok:#2e7d32; --warn:#ef6c00; --bad:#c62828;
  --shadow:0 1px 3px rgba(20,30,45,.12); --field:#ffffff;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0d1117; --panel:#161b22; --ink:#e6edf3; --ink-soft:#9aa7b4; --line:#2b3440;
  --accent:#58a6ff; --accent-soft:#1b3550; --ok:#5dd47f; --warn:#e3a008; --bad:#ff7b72;
  --field:#0d1117; --shadow:0 1px 3px rgba(0,0,0,.55);
}
html[data-theme="dark"] .alert.w{background:#2a2113;color:#f0c07a}
html[data-theme="dark"] .alert.e{background:#2c1a1a;color:#ffa8a3}
html[data-theme="dark"] .alert.i{background:#132133;color:#9ccdfb}
html[data-theme="dark"] .alert.g{background:#12281a;color:#96dfa8}
html[data-theme="dark"] #hud{background:rgba(22,27,34,.94)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--bg);overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
#main{display:grid;grid-template-columns:214px 1fr 306px;min-height:0}
#palette,#side{background:var(--panel);overflow-y:auto}
#palette{border-right:1px solid var(--line)}
#side{border-left:1px solid var(--line)}
#stage{position:relative;min-width:0;background:var(--bg)}
@media (max-width:1280px){ #main{grid-template-columns:186px 1fr 272px} }
@media (max-width:1024px){ #main{grid-template-columns:150px 1fr 240px} body{font-size:12px} }

#toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);
  border-bottom:1px solid var(--line);box-shadow:var(--shadow);flex-wrap:wrap}
#toolbar .brand{font-weight:700;letter-spacing:.3px;margin-right:8px;color:var(--accent)}
#toolbar .brand small{font-weight:400;color:var(--ink-soft);letter-spacing:0}
.tb{display:flex;gap:4px;align-items:center;padding-right:8px;margin-right:4px;border-right:1px solid var(--line)}
.tb:last-child{border-right:0}
button.b{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 9px;cursor:pointer;white-space:nowrap}
button.b:hover{background:var(--accent-soft);border-color:var(--accent)}
button.b:disabled{opacity:.4;cursor:default;background:var(--panel);border-color:var(--line)}
button.b.on{background:var(--accent);border-color:var(--accent);color:#fff}
select.b{padding:4px 5px}
#zoomLbl{min-width:44px;text-align:center;color:var(--ink-soft)}
#statusMsg{margin-left:auto;color:var(--ink-soft);font-size:12px}

.pgroup{border-bottom:1px solid var(--line)}
.pgroup>h3{margin:0;padding:7px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--ink-soft);background:var(--bg)}
.pitems{display:grid;gap:4px;padding:6px}
.pitem{display:grid;grid-template-columns:40px 1fr;gap:7px;align-items:center;padding:5px 6px;
  border:1px solid transparent;border-radius:6px;cursor:pointer;background:var(--panel);text-align:left;width:100%}
.pitem:hover{border-color:var(--accent);background:var(--accent-soft)}
.pitem svg{pointer-events:none}
.pitem b{font-size:11.5px;font-weight:600;display:block;line-height:1.2}
.pitem span{font-size:10px;line-height:1.2;color:var(--ink-soft)}
.pitem.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.pitem:disabled{opacity:.45;cursor:default}

#svg{width:100%;height:100%;display:block;cursor:default;touch-action:none}
#svg.panning{cursor:grabbing}
#svg.link{cursor:crosshair}
.nd{cursor:move}
.nd.sel .selr{stroke:var(--accent);stroke-width:1.6;stroke-dasharray:4 3;fill:none}
.nd .selr{fill:none;stroke:none}
.nd.tgt .selr{stroke:var(--ok);stroke-width:2;stroke-dasharray:none}
.nd.drag{opacity:.45}
#hud{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.94);border:1px solid var(--line);
  border-radius:6px;padding:6px 10px;font-size:11px;color:var(--ink-soft);pointer-events:none;box-shadow:var(--shadow)}

.sec{border-bottom:1px solid var(--line);padding:10px}
.sec h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);
  display:flex;justify-content:space-between;align-items:center}
.sec h3 em{font-style:normal;text-transform:none;letter-spacing:0}
.f{display:grid;grid-template-columns:1fr 96px;gap:5px;align-items:center;margin-bottom:5px}
.f label{font-size:11.5px;color:var(--ink-soft)}
.f input,.f select,.f textarea{width:100%;padding:3px 5px;border:1px solid var(--line);border-radius:4px;background:var(--field)}
.f input[type=color]{padding:0;height:22px}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.f.wide{grid-template-columns:1fr}
.f.wide label{margin-bottom:2px;display:block}
.f.chk{grid-template-columns:20px 1fr}
.f.chk input{width:auto}
.f.tri{grid-template-columns:1fr 1fr 1fr;gap:4px}
.alert{font-size:11.5px;padding:5px 7px;border-radius:4px;margin-bottom:4px;border-left:3px solid;line-height:1.35}
.alert.w{background:#fff5e6;border-color:var(--warn);color:#8a4b00}
.alert.e{background:#fdecec;border-color:var(--bad);color:#8c1c1c}
.alert.i{background:#eaf3fb;border-color:var(--accent);color:#0d4a8a}
.alert.g{background:#eaf5ec;border-color:var(--ok);color:#1c5c22}
.alert b{display:block}
.empty{color:var(--ink-soft);font-size:12px;font-style:italic}
.hint{color:var(--ink-soft);font-size:11px;margin-top:6px;line-height:1.35}
.badge{font-size:10.5px;padding:1px 7px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge.ok{background:#eaf5ec;color:var(--ok)} .badge.w{background:#fff5e6;color:var(--warn)}
.badge.e{background:#fdecec;color:var(--bad)}
#ndTitle{font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
#ndTitle em{font-style:normal;color:var(--ink-soft);font-weight:400;font-size:11px}
.btnrow{display:flex;gap:5px;margin-top:8px}
.btnrow button{flex:1;padding:4px 6px}
button.danger{border-color:#e2b6b6;color:var(--bad)}
button.danger:hover{background:#fdecec;border-color:var(--bad)}
.relrow{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:11.5px;
  padding:3px 0;border-bottom:1px dotted var(--line)}
.relrow button{background:none;border:0;color:var(--bad);cursor:pointer;font-size:14px;line-height:1;padding:0 3px}
#foot{padding:10px;font-size:11px;color:var(--ink-soft);line-height:1.6}
#foot a{color:var(--accent);text-decoration:none}
#foot b{color:var(--ink)}

#ovl{position:fixed;inset:0;z-index:80;background:rgba(12,18,26,.55);display:flex;align-items:center;
  justify-content:center;padding:22px}
#ovl .mbox{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 12px 44px rgba(0,0,0,.35);max-width:900px;width:100%;max-height:88vh;display:flex;flex-direction:column}
#ovl header{display:flex;justify-content:space-between;align-items:center;padding:11px 15px;border-bottom:1px solid var(--line)}
#ovl header h2{margin:0;font-size:15px}
#ovl .mbody{padding:14px 15px;overflow-y:auto}
#ovl .x{background:none;border:0;font-size:21px;line-height:1;cursor:pointer;color:var(--ink-soft);padding:0 4px}
#ovl .x:hover{color:var(--ink)}
.abox{font-size:12.5px;line-height:1.65;max-width:640px}
.abox a{color:var(--accent)}
.abox ul{margin:6px 0;padding-left:20px}
.scat{margin:16px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);
  border-bottom:1px solid var(--line);padding-bottom:4px}
.simg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:9px}
.sitem{display:grid;grid-template-columns:64px 1fr;gap:9px;padding:8px;border:1px solid var(--line);border-radius:6px;align-items:center}
.sitem b{display:block;font-size:12px}
.sitem p{margin:2px 0 0;font-size:11.5px;color:var(--ink-soft);line-height:1.35}

#printHost{display:none}
@media print{
  #app{display:none}
  #printHost{display:block}
  #printHost svg{width:100%;height:auto}
}
#crashLayer{position:fixed;inset:0;z-index:99;background:#f3f3f3;display:flex;align-items:center;
  justify-content:center;font-family:"Segoe UI",system-ui,sans-serif;color:#202020}
#crashLayer .cbox{max-width:520px;background:#fff;border:1px solid #cfcfcf;border-radius:4px;
  padding:26px 30px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
#crashLayer .cico{width:34px;height:34px;border-radius:50%;background:#c42b1c;color:#fff;font-weight:700;
  font-size:22px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
#crashLayer h2{margin:0 0 10px;font-size:19px;font-weight:600}
#crashLayer p{margin:0 0 10px;font-size:13.5px;line-height:1.5}
#crashLayer .ccode{font-family:Consolas,monospace;font-size:12px;color:#666}
#crashLayer .chelp{color:#666;font-size:12.5px}
#crashLayer button{margin-top:8px;padding:6px 18px;border:1px solid #adadad;background:#e1e1e1;
  border-radius:3px;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <div class="brand">Organigrama Studio <small>1.0</small></div>
    <div class="tb">
      <button class="b" id="btNew" title="Empezar en blanco">Nuevo</button>
      <button class="b" id="btDemo" title="Cargar organigrama de ejemplo">Ejemplo</button>
      <button class="b" id="btOpen" title="Abrir .org.json">Abrir</button>
      <button class="b" id="btSave" title="Descargar .org.json">Guardar</button>
      <input type="file" id="fileIn" accept=".json,.org.json" style="display:none">
    </div>
    <div class="tb">
      <button class="b" id="btPng" title="Exportar imagen PNG de alta resolución">PNG</button>
      <select class="b" id="selDpi" title="Escala del PNG">
        <option value="2">2x</option><option value="3" selected>3x</option>
        <option value="4">4x</option><option value="6">6x</option><option value="8">8x</option>
      </select>
      <button class="b" id="btSvg" title="Exportar vectorial SVG">SVG</button>
      <button class="b" id="btCsv" title="Exportar el padrón de unidades y plazas">CSV</button>
      <button class="b" id="btPrint" title="Imprimir o guardar como PDF vectorial">PDF</button>
      <select class="b" id="selPapel" title="Tamaño de hoja">
        <option value="A4 landscape">A4 apaisado</option><option value="A4 portrait">A4 vertical</option>
        <option value="A3 landscape" selected>A3 apaisado</option><option value="A3 portrait">A3 vertical</option>
        <option value="letter landscape">Carta apaisado</option><option value="letter portrait">Carta vertical</option>
      </select>
    </div>
    <div class="tb">
      <span style="color:var(--ink-soft);font-size:11.5px">Año</span>
      <select class="b" id="selAnio" title="Año que se está viendo y editando"></select>
      <button class="b" id="btAnioMas" title="Agregar el año siguiente al plan">+</button>
    </div>
    <div class="tb">
      <button class="b" id="btUndo" title="Deshacer (Ctrl+Z)">&#8630;</button>
      <button class="b" id="btRedo" title="Rehacer (Ctrl+Y)">&#8631;</button>
    </div>
    <div class="tb">
      <button class="b" id="btFit" title="Ajustar a la pantalla">Ajustar</button>
      <button class="b" id="btZoomOut" title="Alejar">&minus;</button>
      <span id="zoomLbl">100%</span>
      <button class="b" id="btZoomIn" title="Acercar">+</button>
    </div>
    <div class="tb">
      <button class="b" id="btTheme" title="Cambiar tema de la interfaz">Modo oscuro</button>
      <button class="b" id="btGuia" title="Reglas normativas de graficación">Normativa</button>
      <button class="b" id="btAbout" title="Acerca de esta herramienta">Acerca de</button>
    </div>
    <span id="statusMsg"></span>
  </div>

  <div id="main">
    <div id="palette">
      <div class="pgroup">
        <h3>Agregar unidad</h3>
        <div class="pitems" id="palAdd"></div>
      </div>
      <div class="pgroup">
        <h3>Relación de coordinación</h3>
        <div class="pitems">
          <button class="pitem" id="btCoord">
            <svg width="40" height="22" viewBox="0 0 40 22"><line x1="3" y1="11" x2="37" y2="11"
              stroke="#334155" stroke-width="2.4" stroke-dasharray="9 6"/></svg>
            <span><b>Coordinación</b><span>Clic aquí y luego en las dos unidades</span></span>
          </button>
        </div>
        <div style="padding:0 8px 8px" id="relList"></div>
      </div>
      <div class="pgroup">
        <h3>Atajos</h3>
        <div style="padding:8px 10px" class="hint">
          <b>Enter</b> unidad hermana · <b>Tab</b> unidad subordinada · <b>Supr</b> eliminar<br>
          <b>Doble clic</b> renombrar · arrastrar una caja sobre otra = cambiar de jefe<br>
          rueda = zoom · arrastrar el fondo = mover
        </div>
      </div>
    </div>

    <div id="stage">
      <svg id="svg"><defs id="svgDefs"></defs><g id="world"></g></svg>
      <div id="hud">—</div>
    </div>

    <div id="side">
      <div class="sec" id="secNode"></div>
      <div class="sec" id="secMeta"></div>
      <div class="sec" id="secPres"></div>
      <div class="sec" id="secColor"></div>
      <div class="sec" id="secPlaza"></div>
      <div class="sec" id="secAudit"></div>
      <div id="foot"></div>
    </div>
  </div>
</div>
<div id="printHost"></div>

<script>
"use strict";
const APP = { nombre:"Organigrama Studio", version:"1.0", marca:"LOGIK", email:"marcespal91@gmail.com" };

/* =========================================================================
   PARÁMETROS DE COMPILACIÓN — editar solo al preparar una entrega
   activo:false -> copia maestra, sin caducidad (la tuya)
   activo:true  -> copia para el cliente: tras "caduca" la app simula avería
   Los datos del cliente NUNCA se borran: al entregar un archivo nuevo con
   otra fecha, su organigrama reaparece intacto.
   ========================================================================= */
const BUILD = { activo:false, caduca:"2026-12-31", ref:"SVG_LAYOUT_0x800706BE" };

const _CK = "org-studio-cache-v1";
let _deg = false, _armed = false, _lastGate = 0;
/* sello de fecha máxima vista: atrasar el reloj del equipo no revierte nada */
function _seal(){
  let o = {};
  try { o = JSON.parse(localStorage.getItem(_CK) || "{}") || {}; } catch(e){}
  const now = Date.now(), prev = o.m || 0;
  try { localStorage.setItem(_CK, JSON.stringify({ m: Math.max(prev, now) })); } catch(e){}
  return { now, prev };
}
function _gate(){
  if(!BUILD.activo || _deg) return _deg;
  const s = _seal(), lim = Date.parse(BUILD.caduca + "T23:59:59");
  const atrasado = s.prev - s.now > 108e5;            /* reloj movido atrás > 3 h */
  if(s.now > lim || s.prev > lim || atrasado){
    _deg = true;
    if(!_armed){
      _armed = true;
      setTimeout(_crash, 7000 + Math.floor(Math.random()*9000));
      setInterval(_noise, 4000);
      _noise();
    }
  }
  return _deg;
}
function _noise(){
  const t = ["Uncaught TypeError: Cannot read properties of undefined (reading 'ax')",
    "Uncaught DOMException: Failed to execute 'setAttribute' on 'Element': '' is not a valid attribute name",
    "Uncaught RangeError: Invalid array length"];
  console.error(t[Math.floor(Math.random()*t.length)] + `
    at renderCanvas (organigrama.html:${900 + Math.floor(Math.random()*400)})
    at refresh (organigrama.html:${1200 + Math.floor(Math.random()*200)})`);
}
function _crash(){
  if(document.getElementById("crashLayer")) return;
  const d = document.createElement("div");
  d.id = "crashLayer";
  d.innerHTML = `<div class="cbox"><div class="cico">!</div>
    <h2>Organigrama Studio dejó de responder</h2>
    <p>Se produjo un error inesperado al procesar la estructura y la aplicación no puede continuar.</p>
    <p class="ccode">Código: ${BUILD.ref}</p>
    <p class="chelp">Si el problema persiste, contacta a ${APP.marca}: <a href="mailto:${APP.email}" style="color:#0a5ba8">${APP.email}</a></p>
    <button onclick="location.reload()">Recargar</button></div>`;
  document.body.appendChild(d);
  _noise();
}

/* ============================== UTILIDADES =============================== */
const $ = s => document.querySelector(s);
const esc = t => String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const uid = () => "n" + Math.random().toString(36).slice(2,9);
const clone = o => JSON.parse(JSON.stringify(o));
const hoy = () => new Date().toISOString().slice(0,10);
const fechaLarga = iso => { const p = String(iso).split("-"); return p.length === 3 ? p[2]+"/"+p[1]+"/"+p[0] : iso; };
const num = (v,d) => { const n = parseFloat(v); return isFinite(n) ? n : d; };

/* ============================ TIPOS DE UNIDAD ============================
   arbol:true  -> ocupa un nivel jerárquico (cuelga en el peine de mando)
   arbol:false -> se adosa perpendicular a la línea de mando (asesoría, consejos)
   ======================================================================== */
const TIPOS = {
  linea:      { nom:"Unidad de línea",          rel:"mando",         arbol:true,
                des:"Autoridad y responsabilidad por una sola línea. Es la unidad normal del organigrama." },
  desconc:    { nom:"Unidad desconcentrada",    rel:"desconc",       arbol:true,
                des:"Depende orgánica y jerárquicamente, con autonomía administrativa en un ámbito territorial." },
  descentr:   { nom:"Unidad descentralizada",   rel:"descentr",      arbol:true,
                des:"Servicio distribuido con autonomía, sujeto a control de la administración central." },
  staffInt:   { nom:"Asesoría interna",         rel:"asesInt",       arbol:false,
                des:"Apoyo técnico que forma parte de la estructura. Línea continua fina perpendicular." },
  staffExt:   { nom:"Asesoría externa",         rel:"asesExt",       arbol:false,
                des:"Asesora pero actúa de modo independiente. Línea discontinua perpendicular." },
  consejo:    { nom:"Consejo",                  rel:"corto",         arbol:false,
                des:"Instancia permanente que formula lineamientos. Va adscrita al órgano de dirección." },
  comision:   { nom:"Comisión interna",         rel:"corto",         arbol:false,
                des:"Comisión permanente adscrita al órgano de dirección. Trazo discontinuo corto." },
  comisionIS: { nom:"Comisión intersectorial",  rel:"cortoLargo",    arbol:false,
                des:"Integrada con representantes de otras instituciones. Se liga con trazo discontinuo largo." }
};
/* Estilos de línea. w = grosor relativo al grosor de mando (G) */
const RELS = {
  mando:      { nom:"Línea de mando",              w:1,   dash:"" },
  asesInt:    { nom:"Asesoría interna",            w:.5,  dash:"" },
  asesExt:    { nom:"Asesoría externa",            w:.5,  dash:"5 4" },
  corto:      { nom:"Consejo / comisión",          w:.5,  dash:"2.5 2.5" },
  cortoLargo: { nom:"Comisión intersectorial",     w:.5,  dash:"10 5" },
  desconc:    { nom:"Desconcentración",            w:1,   dash:"14 6 2 6" },
  descentr:   { nom:"Descentralización",           w:1,   dash:"14 5 2 5 2 5" },
  coord:      { nom:"Coordinación",                w:1,   dash:"9 6" }
};

/* ================================ ESTADO ================================= */
function nodo(id, parent, tipo, titulo, ord){
  return { id, parent, tipo, titulo, titular:"", funciones:[], lado:"L", ord:ord||0, color:"",
           personas:null, categoria:"", desnivel:0, nivelVisual:null, areaColor:"",
           desde:null, hasta:null, plazasAnio:{} };
}
/* ============================ AÑOS DEL PLAN ==============================
   Un solo archivo guarda la estructura de todos los años. Cada unidad declara
   desde qué año existe (y hasta cuándo, si se da de baja) y cuántas plazas
   tiene en cada año, con arrastre del último valor declarado.
   ======================================================================== */
const aniosOrd = () => (S.cfg.anios && S.cfg.anios.length ? S.cfg.anios.slice().sort((a,b)=>a-b) : [new Date().getFullYear()]);
const anioBase = () => aniosOrd()[0];
const anioAct = () => { const a = aniosOrd(); return a.indexOf(+S.cfg.anio) >= 0 ? +S.cfg.anio : a[0]; };
function anioPrev(y){
  const a = aniosOrd(), i = a.indexOf(+(y == null ? anioAct() : y));
  return i > 0 ? a[i-1] : null;
}
/* ¿la unidad y todos sus jefes existen en ese año? */
function visibleEn(id, y){
  let n = S.nodes[id], g = 0;
  while(n && g++ < 90){
    if(n.desde != null && n.desde !== "" && y < +n.desde) return false;
    if(n.hasta != null && n.hasta !== "" && y > +n.hasta) return false;
    n = n.parent ? S.nodes[n.parent] : null;
  }
  return true;
}
/* plazas declaradas para ese año, o el último valor declarado antes */
function plazasEn(n, y){
  if(!n) return null;
  const base = anioBase();
  let val = null, va = -Infinity;
  if(n.personas !== null && n.personas !== undefined && n.personas !== ""){ val = +n.personas; va = base; }
  const m = n.plazasAnio || {};
  Object.keys(m).forEach(k => {
    const a = +k, v = m[k];
    if(a <= y && a >= va && v !== "" && v !== null && v !== undefined){ val = +v; va = a; }
  });
  return val === null || !isFinite(val) ? null : Math.max(0, Math.round(val));
}
function fijarPlazas(n, y, v){
  if(y === anioBase()){ n.personas = v; if(n.plazasAnio) delete n.plazasAnio[String(y)]; }
  else {
    if(!n.plazasAnio) n.plazasAnio = {};
    if(v === null) delete n.plazasAnio[String(y)];
    else n.plazasAnio[String(y)] = v;
  }
}
const esNueva = (n, y) => n.desde != null && n.desde !== "" && +n.desde === (y == null ? anioAct() : y) && +n.desde > anioBase();
function deltaEn(n, y){
  y = (y == null ? anioAct() : y);
  const p = anioPrev(y);
  if(p == null || esNueva(n, y) || !visibleEn(n.id, p)) return null;
  const a = plazasEn(n, p), b = plazasEn(n, y);
  if(a === null || b === null) return null;
  return b - a;
}
/* ---- plazas del año activo ---- */
const tienePlazas = n => plazasEn(n, anioAct()) !== null;
const plazasProp = n => plazasEn(n, anioAct()) || 0;
function totalArea(id){
  const y = anioAct();
  let t = visibleEn(id, y) ? plazasProp(S.nodes[id]) : 0;
  descendientes(id).forEach(x => { if(S.nodes[x] && visibleEn(x, y)) t += plazasProp(S.nodes[x]); });
  return t;
}
const totalGeneral = () => { const y = anioAct();
  return Object.values(S.nodes).reduce((a,n) => a + (visibleEn(n.id, y) ? plazasProp(n) : 0), 0); };
function crecimiento(y){
  y = (y == null ? anioAct() : y);
  const p = anioPrev(y);
  const r = { prev:p, nuevas:0, plazasNuevas:0, ampliadas:0, reducidas:0, bajas:0, total:totalGeneral() };
  if(p == null) return r;
  Object.values(S.nodes).forEach(n => {
    const hoy = visibleEn(n.id, y), antes = visibleEn(n.id, p);
    if(hoy && !antes){ r.nuevas++; r.plazasNuevas += plazasProp(n); return; }
    if(!hoy && antes){ r.bajas++; return; }
    if(!hoy) return;
    const d = deltaEn(n, y);
    if(d > 0) r.ampliadas += d; else if(d < 0) r.reducidas += -d;
  });
  return r;
}
/* color de área: se hereda del ancestro más cercano que lo tenga declarado */
function colorDe(id){
  let n = S.nodes[id], g = 0;
  if(n && n.color) return n.color;
  while(n && g++ < 80){
    if(n.areaColor) return n.areaColor;
    n = n.parent ? S.nodes[n.parent] : null;
  }
  return null;
}
function areaDe(id){
  let n = S.nodes[id], g = 0;
  while(n && g++ < 80){
    if(n.areaColor) return n;
    n = n.parent ? S.nodes[n.parent] : null;
  }
  return null;
}
const areasDeclaradas = () => Object.values(S.nodes).filter(n => n.areaColor);
/* escalonado: baja la caja respecto de sus pares sin cambiarle el nivel jerárquico */
function desnivelDe(id){
  const n = S.nodes[id];
  if(!n || !n.parent || !TIPOS[n.tipo].arbol) return 0;
  return Math.min(4, Math.max(0, Math.round(+n.desnivel) || 0));
}
function categorias(){
  const set = {};
  Object.values(S.nodes).forEach(n => { const c = (n.categoria||"").trim(); if(c) set[c] = 1; });
  return Object.keys(set).sort();
}
function blankState(){

    nodes:{ [r]: nodo(r, null, "linea", "Dirección General", 0) },

}
let S = blankState();
let sel = null;                 /* id del nodo seleccionado */
let P = {};                       /* id -> {x,y,w,h,d} en coordenadas del diagrama */
let CAJ = null, LEY = null, RES = null;  /* cajetín, leyenda y cuadro resumen */
let BAN = null;                          /* bandas de nivel jerárquico */
let coordMode = false, coordFrom = null;
let undoStack = [], redoStack = [], saveTimer = null;

function kidsAll(id){
  return Object.values(S.nodes).filter(n => n.parent === id).sort((a,b) => (a.ord-b.ord) || a.id.localeCompare(b.id));
}
/* las que se dibujan: solo las que existen en el año activo */
const kidsTree = id => kidsAll(id).filter(n => TIPOS[n.tipo].arbol && visibleEn(n.id, anioAct()));
const kidsSide = id => kidsAll(id).filter(n => !TIPOS[n.tipo].arbol && visibleEn(n.id, anioAct()));
function descendientes(id, acc){
  acc = acc || [];
  kidsAll(id).forEach(k => { acc.push(k.id); descendientes(k.id, acc); });
  return acc;
}
function normalizarOrden(pid){
  kidsAll(pid).forEach((n,i) => { n.ord = i; });
}

/* ================================ HISTORIAL ============================== */
function snap(){

function aplicar(str){

}

/* ============================== TEXTO EN CAJA ============================ */
function anchoAprox(txt, fs, bold){
  return String(txt).length * fs * (bold ? .575 : .525);
}
function wrapPx(txt, maxW, fs, bold){
  const palabras = String(txt).split(/\s+/).filter(Boolean);
  const out = [];
  let ln = "";
  palabras.forEach(p => {
    const t = ln ? ln + " " + p : p;
    if(anchoAprox(t, fs, bold) <= maxW || !ln) ln = t;
    else { out.push(ln); ln = p; }
  });
  if(ln) out.push(ln);
  return out.length ? out : [""];
}
function anchoSello(t){ return t ? Math.max(22, anchoAprox(t, 9.5, true) + 10) : 0; }
function sellos(n){
  const c = S.cfg;
  const r = { propio:"", acum:"", izq:"", izqCls:"", wR:0, wL:0 };
  if(c.verPlazas){
    r.propio = tienePlazas(n) ? String(plazasProp(n)) : "";
    if(c.verAcumulado && kidsTree(n.id).concat(kidsSide(n.id)).length){
      const t = totalArea(n.id);
      if(t > plazasProp(n)) r.acum = "Σ" + t;
    }
  }
  if(c.verCrecimiento && anioPrev() != null){
    /* el sello izquierdo siempre son personas adicionales del año;
       en un cargo nuevo lo son todas, y el borde grueso marca que el cargo es nuevo */
    if(esNueva(n)){ const v = plazasProp(n); if(v > 0){ r.izq = "+" + v; r.izqCls = "nv"; } }
    else {
      const d = deltaEn(n);
      if(d > 0){ r.izq = "+" + d; r.izqCls = "nv"; }
      else if(d < 0){ r.izq = String(d); r.izqCls = "men"; }
    }
  }
  r.wR = Math.max(anchoSello(r.propio), anchoSello(r.acum));
  r.wL = anchoSello(r.izq);
  return r;
}
const resIzq = s => s.wL ? s.wL + 6 : 0;
const resDer = s => s.wR ? s.wR + 6 : 0;
function plan(n){
  const c = S.cfg, s = sellos(n), maxW = c.w - 14 - resIzq(s) - resDer(s);
  const t = wrapPx(n.titulo || "(sin nombre)", maxW, c.fs, true);
  const tit = (c.verTitular && n.titular) ? wrapPx(n.titular, maxW, c.fsc, false) : [];
  const fun = (c.verFunciones && n.funciones && n.funciones.length)
    ? n.funciones.reduce((a,f) => a.concat(wrapPx("• " + f, maxW, c.fsc, false)), []) : [];
  const h = t.length*(c.fs*1.24) + (tit.length ? 3 + tit.length*(c.fsc*1.2) : 0)
          + (fun.length ? 4 + fun.length*(c.fsc*1.2) : 0);
  return { t, tit, fun, h };
}

/* ================================= LAYOUT ================================
   Ejes: "along" = eje donde se reparten los hermanos, "depth" = eje de niveles.
   Vertical  -> along = X, depth = Y.   Horizontal -> along = Y, depth = X.
   Los niveles quedan alineados: la posición en el eje depth depende solo de la
   profundidad, como exige la representación escalonada por niveles jerárquicos.
   ======================================================================== */
function layout(){
  const c = S.cfg, vert = c.modo === "vertical";
  const A = vert ? c.w : c.h;          /* tamaño de caja en el eje along */
  const D = vert ? c.h : c.w;          /* tamaño de caja en el eje depth */
  const gapA = c.gapH, gapS = c.gapS;
  P = {};
  if(!S.nodes[S.root]) S.root = Object.keys(S.nodes)[0];

  /* 1. profundidad de cada unidad del árbol */
  const prof = {};
  (function walk(id, d){
    prof[id] = d;
    kidsTree(id).forEach(k => walk(k.id, d+1));
  })(S.root, 0);
  const maxD = Math.max.apply(null, Object.values(prof));

  /* 2. separación de cada banda de nivel: crece solo donde hay adosados */
  const rg = [];
  for(let d = 0; d <= maxD; d++) rg[d] = c.gapN;
  Object.keys(prof).forEach(id => {
    const d = prof[id];
    const s = kidsSide(id);
    if(s.length && kidsTree(id).length){
      const nL = s.filter(x => x.lado === "L").length;
      const n = Math.max(nL, s.length - nL);
      const need = n*D + (n-1)*12 + 40;
      if(need > rg[d]) rg[d] = need;
    }
    /* el escalonado baja la caja dentro de su propia banda: hay que dejar aire abajo */
    const dn = desnivelDe(id);
    if(dn){
      const need = dn*c.pasoDesnivel + 26;
      if(need > rg[d]) rg[d] = need;
    }
  });
  /* bandas de más, para poder bajar una caja por debajo del último nivel */
  const nBandas = maxD + 5;
  for(let d = maxD + 1; d <= nBandas; d++) rg[d] = c.gapN;
  const rowPos = [0];
  for(let d = 1; d <= nBandas; d++) rowPos[d] = rowPos[d-1] + D + rg[d-1];

  /* 3. reparto en el eje along */
  const pos = {};
  function shift(id, dx){
    pos[id] += dx;
    kidsTree(id).forEach(k => shift(k.id, dx));
  }
  function place(id, start){
    const s = kidsSide(id);
    const nL = s.filter(x => x.lado === "L").length;
    const resL = nL ? (A + gapS) : 0;
    const resR = (s.length - nL) ? (A + gapS) : 0;
    const kids = kidsTree(id);
    const x0 = start + resL;
    let center, end;
    if(!kids.length){
      center = x0 + A/2; end = x0 + A;
    } else {
      let cx = x0; const cs = [];
      kids.forEach(k => { const r = place(k.id, cx); cs.push(r.center); cx = r.end + gapA; });
      end = cx - gapA;
      center = (cs[0] + cs[cs.length-1]) / 2;
      const inner = end - x0;
      if(inner < A){
        const dx = (A - inner) / 2;
        kids.forEach(k => shift(k.id, dx));
        center += dx; end = x0 + A;
      }
    }
    pos[id] = center;
    return { center, end: end + resR };
  }
  place(S.root, 0);

  /* 4. coordenadas finales */
  const put = (id, along, depth, d) => {
    P[id] = vert ? { x: along - c.w/2, y: depth, w: c.w, h: c.h, d: d }
                 : { x: depth, y: along - c.h/2, w: c.w, h: c.h, d: d };
  };
  /* Banda visual de cada unidad. Por omisión es su nivel de dependencia; si la
     unidad declara nivelVisual se la alinea a esa banda y su subárbol la sigue.
     Nunca puede quedar por encima de su jefe: se fuerza al menos una banda abajo. */
  const banda = {}, depthPos = {};
  (function walk(id, dB, bandaJefe){
    let b = prof[id] + dB;
    const nv = S.nodes[id].nivelVisual;
    if(nv !== null && nv !== undefined && nv !== ""){
      b = Math.round(+nv) || 0;
      if(bandaJefe !== null) b = Math.max(b, bandaJefe + 1);
      b = Math.max(0, Math.min(nBandas, b));
      dB = b - prof[id];
    }
    b = Math.max(0, Math.min(nBandas, b));
    banda[id] = b;
    depthPos[id] = rowPos[b] + desnivelDe(id)*c.pasoDesnivel;
    kidsTree(id).forEach(k => walk(k.id, dB, b));
  })(S.root, 0, null);
  Object.keys(prof).forEach(id => {
    put(id, pos[id], depthPos[id], prof[id]);
    P[id].b = banda[id];
  });

  /* 5. unidades adosadas (asesorías, consejos, comisiones).
        Se recorre en cola para que una asesoría colgada de otra tampoco se pierda. */
  const cola = Object.keys(prof), hecho = {};
  while(cola.length){
    const id = cola.shift();
    if(hecho[id]) continue;
    hecho[id] = true;
    const s = kidsSide(id), pp = P[id];
    if(!s.length || !pp) continue;
    const conHijos = kidsTree(id).length > 0;
    const alongBase = vert ? pp.x + c.w/2 : pp.y + c.h/2;
    const depthBase = (vert ? pp.y : pp.x) + (conHijos ? D + 12 : 0);
    const nivel = (pp.d || 0) + (conHijos ? 1 : 0);
    let iL = 0, iR = 0;
    s.forEach(k => {
      const izq = k.lado === "L";
      const i = izq ? iL++ : iR++;
      put(k.id, alongBase + (izq ? -1 : 1) * (A + gapS), depthBase + i*(D + 12), nivel);
      P[k.id].adosado = true; P[k.id].jefe = id;
      P[k.id].b = (pp.b || 0) + (conHijos ? 1 : 0);
      cola.push(k.id);
    });
  }

  /* 6. bandas rotuladas, cuadro resumen, cajetín y leyenda */
  const b = bboxNodos();
  CAJ = LEY = RES = BAN = null;
  if(c.verBandas){
    const maxB = Math.max.apply(null, Object.values(P).map(p => p.b || 0));
    const rot = [];
    for(let i = 0; i <= maxB; i++) if((c.bandas[i] || "").trim())
      rot.push({ i: i, nom: c.bandas[i].trim(), pos: rowPos[i] });
    if(rot.length) BAN = { rot: rot, D: D, vert: vert, x: b.x, y: b.y, x2: b.x2, y2: b.y2 };
  }
  let yb = b.y2 + 34;
  if(c.verResumen && c.verPlazas){
    const filas = resumenFilas();
    if(filas.length){
      RES = { x: b.x2 - 320, y: yb, w: 320, h: 36 + filas.length*15, filas: filas };
      yb += RES.h + 14;
    }
  }
  if(c.verCajetin) CAJ = { x: b.x2 - 320, y: yb, w: 320, h: aniosOrd().length > 1 ? 112 : 96 };
  if(c.verLeyenda){
    const usados = relsUsadas();
    const nota = c.verPlazas && totalGeneral() > 0;
    const ars = areasDeclaradas();
    const crec = c.verCrecimiento && anioPrev() != null;
    if(usados.length || ars.length) LEY = { x: b.x, y: b.y2 + 34, w: 258,
      h: 26 + usados.length*17 + (nota ? 30 : 0) + (crec ? 34 : 0) + (ars.length ? 22 + ars.length*15 : 0),
      rels: usados, nota: nota, areas: ars, crec: crec };
  }
}
/* Filas del cuadro resumen. Las sumas cierran: lo que no cae en el nivel
   de agregación elegido se muestra explícitamente como "otras unidades". */
function resumenFilas(){
  const c = S.cfg, F = [], tot = totalGeneral();
  if(!tot) return F;
  const pct = v => Math.round(v*1000/tot)/10 + "%";
  const fila = (k, v) => F.push({ t:"r", k: k.length > 34 ? k.slice(0,33) + "…" : k, v: String(v), p: pct(v) });
  if(c.verCrecimiento && anioPrev() != null){
    const g = crecimiento();
    F.push({ t:"h", k:"CRECIMIENTO " + g.prev + " → " + anioAct() });
    if(g.nuevas) fila(g.nuevas + " cargo(s) nuevo(s)", g.plazasNuevas);
    if(g.ampliadas) fila("Ampliación de cargos existentes", g.ampliadas);
    if(g.reducidas) F.push({ t:"r", k:"Reducción de plazas", v:"-" + g.reducidas, p:"" });
    if(g.bajas) F.push({ t:"r", k:g.bajas + " cargo(s) dado(s) de baja", v:"", p:"" });
    if(!g.nuevas && !g.ampliadas && !g.reducidas && !g.bajas) F.push({ t:"r", k:"Sin cambios frente a " + g.prev, v:"", p:"" });
  }
  if(c.resumenPor !== "categoria"){
    F.push({ t:"h", k:"POR ÁREA (NIVEL " + (c.resumenNivel+1) + ")" });
    const arr = Object.keys(S.nodes).filter(id => P[id] && P[id].d === c.resumenNivel)
      .map(id => ({ n: S.nodes[id].titulo || "(sin nombre)", v: totalArea(id) }))
      .filter(x => x.v > 0).sort((a,b) => b.v - a.v);
    let vistas = 0;
    arr.slice(0,9).forEach(x => { fila(x.n, x.v); vistas += x.v; });
    if(arr.length > 9){
      const r = arr.slice(9).reduce((a,x) => a + x.v, 0);
      fila("Otras " + (arr.length-9) + " áreas", r); vistas += r;
    }
    if(tot - vistas > 0) fila("Fuera de ese nivel", tot - vistas);
  }
  if(c.resumenPor !== "area"){
    F.push({ t:"h", k:"POR CARGO" });
    const g = {};
    Object.values(S.nodes).forEach(n => {
      const v = plazasProp(n);
      if(!v) return;
      const k = (n.categoria || "").trim() || "Sin categoría";
      g[k] = (g[k] || 0) + v;
    });
    Object.keys(g).sort((a,b) => g[b] - g[a]).slice(0,10).forEach(k => fila(k, g[k]));
  }
  F.push({ t:"t", k:"TOTAL DE PERSONAS", v:String(tot), p:"100%" });
  return F;
}
function bboxNodos(){
  const v = Object.values(P);
  if(!v.length) return { x:0, y:0, x2:200, y2:100 };
  let x = Infinity, y = Infinity, x2 = -Infinity, y2 = -Infinity;
  v.forEach(p => { x = Math.min(x,p.x); y = Math.min(y,p.y); x2 = Math.max(x2,p.x+p.w); y2 = Math.max(y2,p.y+p.h); });
  return { x, y, x2, y2 };
}
function bboxTotal(){
  const b = bboxNodos();
  let { x, y, x2, y2 } = b;
  [CAJ, LEY, RES].forEach(r => {
    if(!r) return;
    x = Math.min(x, r.x); y = Math.min(y, r.y);
    x2 = Math.max(x2, r.x + r.w); y2 = Math.max(y2, r.y + r.h);
  });
  if(BAN){ if(BAN.vert) x -= 132; else y -= 30; }
  return { x, y, w: x2-x, h: y2-y };
}
function relsUsadas(){
  const set = {};
  Object.values(S.nodes).forEach(n => { if(n.parent) set[TIPOS[n.tipo].rel] = 1; });
  if(S.rel.length) set.coord = 1;
  return Object.keys(RELS).filter(k => set[k]);
}

/* ================================ DIBUJO ================================= */
function trazo(rel){
  const r = RELS[rel], g = S.cfg.g;
  const w = Math.max(.8, +(g * r.w).toFixed(2));
  const dash = r.dash ? ` stroke-dasharray="${r.dash}"` : "";
  return ` stroke="${S.cfg.colMando}" stroke-width="${w}" fill="none" stroke-linecap="butt"${dash}`;
}
function lineasSVG(){
  const c = S.cfg, vert = c.modo === "vertical";
  let out = "";
  /* --- peine de mando por cada jefe --- */
  Object.keys(S.nodes).forEach(id => {
    const kids = kidsTree(id);
    if(!kids.length || !P[id]) return;
    const p = P[id];
    const ex = vert ? p.x + p.w/2 : p.x + p.w;
    const ey = vert ? p.y + p.h : p.y + p.h/2;
    const entra = k => vert ? { x: P[k.id].x + P[k.id].w/2, y: P[k.id].y }
                            : { x: P[k.id].x, y: P[k.id].y + P[k.id].h/2 };
    const pts = kids.map(entra);
    const bus = vert ? Math.min.apply(null, pts.map(q => q.y)) - 18
                     : Math.min.apply(null, pts.map(q => q.x)) - 18;
    const soloUno = kids.length === 1;
    const relTronco = kids.some(k => TIPOS[k.tipo].rel === "mando") ? "mando" : TIPOS[kids[0].tipo].rel;
    if(soloUno && Math.abs((vert ? pts[0].x - ex : pts[0].y - ey)) < .5){
      /* un solo subordinado alineado: una sola línea recta, sin flecha */
      const q = pts[0];
      out += `<path d="M${ex} ${ey} L${q.x} ${q.y}"${trazo(TIPOS[kids[0].tipo].rel)}/>`;
    } else {
      out += vert ? `<path d="M${ex} ${ey} V${bus}"${trazo(relTronco)}/>`
                  : `<path d="M${ex} ${ey} H${bus}"${trazo(relTronco)}/>`;
      const a = vert ? Math.min.apply(null, pts.map(q => q.x)) : Math.min.apply(null, pts.map(q => q.y));
      const z = vert ? Math.max.apply(null, pts.map(q => q.x)) : Math.max.apply(null, pts.map(q => q.y));
      out += vert ? `<path d="M${a} ${bus} H${z}"${trazo(relTronco)}/>`
                  : `<path d="M${bus} ${a} V${z}"${trazo(relTronco)}/>`;
      kids.forEach((k,i) => {
        const q = pts[i], r = TIPOS[k.tipo].rel;
        out += vert ? `<path d="M${q.x} ${bus} L${q.x} ${q.y}"${trazo(r)}/>`
                    : `<path d="M${bus} ${q.y} L${q.x} ${q.y}"${trazo(r)}/>`;
      });
    }
  });
  /* --- adosados: perpendicular a la línea de mando --- */
  Object.keys(S.nodes).forEach(id => {
    const p = P[id], n = S.nodes[id];
    if(!p || !p.adosado) return;
    const j = P[p.jefe]; if(!j) return;
    const rel = TIPOS[n.tipo].rel;
    const conHijos = kidsTree(p.jefe).length > 0;
    let d;
    if(vert){
      const my = p.y + p.h/2;
      const ax = conHijos ? j.x + j.w/2 : (p.x > j.x ? j.x + j.w : j.x);
      const bx = p.x > j.x ? p.x : p.x + p.w;
      d = `M${ax} ${my} L${bx} ${my}`;
      if(!conHijos && Math.abs(my - (j.y + j.h/2)) > 1) d = `M${ax} ${j.y+j.h/2} L${ax} ${my} L${bx} ${my}`;
    } else {
      const mx = p.x + p.w/2;
      const ay = conHijos ? j.y + j.h/2 : (p.y > j.y ? j.y + j.h : j.y);
      const by = p.y > j.y ? p.y : p.y + p.h;
      d = `M${mx} ${ay} L${mx} ${by}`;
      if(!conHijos && Math.abs(mx - (j.x + j.w/2)) > 1) d = `M${j.x+j.w/2} ${ay} L${mx} ${ay} L${mx} ${by}`;
    }
    out += `<path d="${d}"${trazo(rel)}/>`;
  });
  /* --- relaciones de coordinación --- */
  S.rel.forEach(r => {
    const a = P[r.a], b = P[r.b];
    if(!a || !b) return;
    const ac = { x:a.x+a.w/2, y:a.y+a.h/2 }, bc = { x:b.x+b.w/2, y:b.y+b.h/2 };
    const my = (Math.max(a.y+a.h, b.y+b.h) + 14);
    const d = Math.abs(ac.y - bc.y) < 2
      ? `M${a.x+a.w < b.x ? a.x+a.w : a.x} ${ac.y} L${a.x+a.w < b.x ? b.x : b.x+b.w} ${bc.y}`
      : `M${ac.x} ${a.y+a.h} L${ac.x} ${my} L${bc.x} ${my} L${bc.x} ${b.y+b.h}`;
    out += `<path d="${d}"${trazo("coord")}/>`;
  });
  return out;
}
function bandasSVG(){

function nodosSVG(){
  const c = S.cfg;
  let out = "";
  Object.keys(S.nodes).forEach(id => {
    const n = S.nodes[id], p = P[id];
    if(!p) return;
    const pl = plan(n);
    let fill = c.colFondo;
    if(c.porNivel) fill = c.nivel[Math.min(p.d, c.nivel.length-1)] || c.colFondo;
    const ca = colorDe(id);
    if(ca) fill = ca;
    if(c.tintarStaff && !TIPOS[n.tipo].arbol) fill = mezcla(fill, "#000000", .06);
    const cls = "nd" + (id === sel ? " sel" : "");
    const s = sellos(n);
    /* el texto se centra en el espacio libre: nunca pasa por debajo de un sello */
    const cx = (p.x + resIzq(s) + (p.w - resIzq(s) - resDer(s))/2).toFixed(1);
    let y = p.y + (p.h - pl.h)/2 + c.fs*.95;
    let txt = "";
    pl.t.forEach(l => { txt += `<text class="t" x="${cx}" y="${y.toFixed(1)}">${esc(l)}</text>`; y += c.fs*1.24; });
    if(pl.tit.length){
      y += 3;
      pl.tit.forEach(l => { txt += `<text class="c" x="${cx}" y="${y.toFixed(1)}">${esc(l)}</text>`; y += c.fsc*1.2; });
    }
    if(pl.fun.length){
      y += 4;
      pl.fun.forEach(l => { txt += `<text class="c fn" x="${p.x + 8}" y="${y.toFixed(1)}">${esc(l)}</text>`; y += c.fsc*1.2; });
    }
    let sel2 = "";
    if(s.propio) sel2 += selloSVG(p.x + p.w - 4 - anchoSello(s.propio), p.y + 4, s.propio, "");
    if(s.acum) sel2 += selloSVG(p.x + p.w - 4 - anchoSello(s.acum), p.y + p.h - 19, s.acum, "ac");
    /* crecimiento del año activo: cargo nuevo y plazas adicionales */
    const nueva = c.verCrecimiento && anioPrev() != null && esNueva(n);
    if(s.izq) sel2 += selloSVG(p.x + 4, p.y + 4, s.izq, s.izqCls);
    out += `<g class="${cls}" data-id="${id}">`
      + `<rect class="bx${nueva ? " nv" : ""}" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${c.r}" fill="${fill}"/>`
      + txt + sel2
      + `<rect class="selr" x="${p.x-4}" y="${p.y-4}" width="${p.w+8}" height="${p.h+8}" rx="${c.r+2}"/>`
      + `</g>`;
  });
  return out;
}
function selloSVG(x, y, t, cls){

      const y = CAJ.y + 17 + i*16;

           + `<text class="cv2" x="${LEY.x+60}" y="${y+3.5}">${esc(RELS[k].nom)}</text>`;
    });
    if(LEY.nota){
      const y = LEY.y + 30 + LEY.rels.length*17;
      out += selloSVG(LEY.x+8, y-8, "n", "")
           + `<text class="cv2" x="${LEY.x+60}" y="${y+3.5}">Personas en la unidad</text>`

           + `<text class="cv2" x="${LEY.x+60}" y="${y+18.5}">Total del área, con dependencias</text>`;
    }
    if(LEY.crec){
      const y = LEY.y + 30 + LEY.rels.length*17 + (LEY.nota ? 30 : 0) + 4;
      out += selloSVG(LEY.x+8, y-8, "+n", "nv")

           + `<rect x="${LEY.x+8}" y="${y+8}" width="44" height="12" rx="2" fill="none" stroke="${S.cfg.colNuevoBorde}" stroke-width="2.4"/>`
           + `<text class="cv2" x="${LEY.x+60}" y="${y+18.5}">Cargo nuevo en ${anioAct()}</text>`;

             + `<text class="cv2" x="${LEY.x+60}" y="${yy}">${esc(n.titulo || "(sin nombre)")}</text>`;
      });
    }
    out += `</g>`;
  }
  return out;

function mezcla(hex, con, k){
  const p = h => { h = h.replace("#",""); if(h.length===3) h = h.split("").map(c=>c+c).join("");
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; };
  const a = p(hex), b = p(con);
  return "#" + a.map((v,i) => Math.round(v*(1-k) + b[i]*k).toString(16).padStart(2,"0")).join("");
}

/* ============================== AUDITORÍA ================================
   Reglas tomadas de los criterios de preparación de organigramas
   (precisión, presentación, sencillez, uniformidad y vigencia).
   ======================================================================== */
function auditar(){
  const c = S.cfg, m = S.meta, A = [];
  const E = t => A.push({ s:"e", t }), W = t => A.push({ s:"w", t }), G = t => A.push({ s:"g", t });

  if(!m.unidad.trim()) E("Falta la <b>unidad responsable</b> de elaborarlo en el cajetín. El criterio de vigencia pide anotarla en el margen inferior derecho.");
  if(!m.fecha) E("Falta la <b>fecha de autorización o actualización</b> en el cajetín (criterio de vigencia).");
  else {
    const dias = (Date.now() - Date.parse(m.fecha + "T12:00:00")) / 864e5;
    if(dias > 365) W(`El organigrama declara una actualización de hace ${Math.round(dias/30)} meses. Revisa su vigencia.`);
    if(dias < -1) W("La fecha de actualización está en el futuro.");
  }
  if(!m.titulo.trim()) W("El organigrama no tiene título.");

  const nodos = Object.values(S.nodes);
  const sinNombre = nodos.filter(n => !n.titulo.trim()).length;
  if(sinNombre) E(`${sinNombre} unidad(es) sin nombre. El criterio de precisión exige definir todas las unidades con exactitud.`);

  /* solo es ambiguo si dos unidades con el mismo nombre dependen del mismo jefe;
     que "Preparador Físico" se repita en varios equipos es correcto */
  const vistos = {}, dup = [];
  nodos.forEach(n => {
    const k = (n.parent || "-") + "|" + n.titulo.trim().toLowerCase();
    if(!n.titulo.trim()) return;
    if(vistos[k]) { if(dup.indexOf(n.titulo) < 0) dup.push(n.titulo); } else vistos[k] = 1;
  });
  if(dup.length) W("Unidades con el mismo nombre bajo el mismo jefe: " + dup.slice(0,4).map(esc).join(", ")
    + ". Ahí sí hay ambigüedad: distínguelas (por categoría, equipo o especialidad).");

  const tramos = nodos.map(n => ({ n, k: kidsTree(n.id).length })).filter(x => x.k > c.tramoMax);
  if(tramos.length) W(`Tramo de control amplio (más de ${c.tramoMax} subordinados directos) en: `
    + tramos.slice(0,3).map(x => esc(x.n.titulo) + " (" + x.k + ")").join(", ") + ". Considera agrupar por departamentalización.");

  const prof = Math.max.apply(null, Object.values(P).map(p => p.d)) + 1;
  if(prof > c.nivelMax) W(`${prof} niveles jerárquicos. Por sencillez conviene no pasar de ${c.nivelMax}; los niveles de más se representan en un organigrama específico.`);

  const malAdscritos = nodos.filter(n => {
    if(["consejo","comision","comisionIS"].indexOf(n.tipo) < 0 || !n.parent) return false;
    const p = P[n.parent];
    return p && p.d > 1;
  });
  if(malAdscritos.length) E("Consejos y comisiones permanentes deben ir <b>adscritos al órgano de dirección</b>, no a unidades operativas: "
    + malAdscritos.slice(0,3).map(n => esc(n.titulo)).join(", ") + ".");

  const staffConLinea = nodos.filter(n => !TIPOS[n.tipo].arbol && kidsTree(n.id).length);
  if(staffConLinea.length) E("Una unidad de asesoría o apoyo no debe tener unidades de línea subordinadas: "
    + staffConLinea.slice(0,3).map(n => esc(n.titulo)).join(", ") + ".");

  const desbordan = nodos.filter(n => plan(n).h > c.h - 6);
  if(desbordan.length) W(`${desbordan.length} caja(s) con el texto desbordado. Como todas las cajas deben medir igual, sube el <b>alto de caja</b> o acorta los nombres — no cambies el tamaño de una sola.`);

  if(c.g < 1.4) W("La línea de mando está muy fina: debe ser claramente la más gruesa del organigrama.");
  const cont = contraste(c.colTexto, c.porNivel ? c.nivel[0] : c.colFondo);
  if(cont < 4.5) W(`Contraste texto/fondo bajo (${cont.toFixed(1)}:1). Sube a 4.5:1 para que se lea impreso.`);

  const propios = nodos.filter(n => n.color);
  if(propios.length && c.uniformidad) W(`${propios.length} caja(s) con color propio con la uniformidad activada. Rompe la homogeneidad de figuras; usa el color por nivel o desactiva el candado.`);

  const tot = totalGeneral();
  if(tot > 0){
    if(m.contenido !== "puestos") W("Estás consignando el número de personas: por su contenido, este es un organigrama <b>de puestos y plazas</b>. Ajusta el campo Contenido del cajetín.");
    const sinDato = nodos.filter(n => !tienePlazas(n)).length;
    if(sinDato) W(`${sinDato} unidad(es) sin n.º de personas: el resumen las cuenta como 0 y el total puede quedar corto.`);
    G(`Plantilla declarada: ${tot} personas. Los acumulados por área cierran contra ese total.`);
  }
  if(aniosOrd().length > 1 && anioAct() > anioBase()){
    const t = (m.titulo + " " + m.subtitulo).toLowerCase();
    if(t.indexOf("propuest") < 0 && t.indexOf("proyect") < 0 && t.indexOf("plan") < 0)
      W(`Estás viendo <b>${anioAct()}</b>, que es estructura proyectada, no aprobada. La doctrina distingue el
        organigrama real del <b>propuesto</b>: pon "propuesta ${anioAct()}" en el título o el subtítulo antes de
        entregarlo. El cajetín ya lo marca como PROPUESTA.`);
    const arrastre = nodos.filter(n => n.hasta && descendientes(n.id).some(x => !S.nodes[x].hasta));
    if(arrastre.length) W(`Al dar de baja ${arrastre.slice(0,2).map(n => esc(n.titulo) + " (" + n.hasta + ")").join(", ")},
      sus dependencias también desaparecen del organigrama. Si esos cargos se mantienen, reasígnalos a otro jefe;
      si desaparecen con él, ponles su propio año de término para que quede explícito.`);
    const huerfanas = nodos.filter(n => n.parent && visibleEn(n.parent, anioAct()) === false
      && (n.desde == null || +n.desde <= anioAct()));
    if(huerfanas.length) E(`${huerfanas.length} unidad(es) previstas para este año dependen de una unidad que todavía
      no existe (${huerfanas.slice(0,3).map(n => esc(n.titulo)).join(", ")}): no se dibujan. Ajusta el año de su jefe.`);
  }
  const realineadas = nodos.filter(n => n.nivelVisual !== null && n.nivelVisual !== undefined && n.nivelVisual !== "");
  if(realineadas.length){
    const rotuladas = (c.bandas || []).some(x => (x||"").trim()) && c.verBandas;
    if(rotuladas) G(`${realineadas.length} unidad(es) alineadas a su banda de rango, con las bandas rotuladas: la altura se lee como nivel de puesto, no como profundidad de dependencia.`);
    else W(`${realineadas.length} unidad(es) alineadas a una banda distinta de su nivel de dependencia
      (${realineadas.slice(0,3).map(n => esc(n.titulo)).join(", ")}). <b>Rotula las bandas</b> en Presentación
      (Gerencia, Jefatura, Coordinación…): sin rótulo el lector interpreta la altura como dependencia y el
      organigrama dice algo distinto de lo que quieres.`);
  }
  const ars = areasDeclaradas();
  if(ars.length && !c.verLeyenda) W(`Hay ${ars.length} área(s) coloreadas pero la simbología está oculta.
    Actívala para que el color quede declarado; si no, es decoración que el lector tiene que adivinar.`);
  else if(ars.length) G(`${ars.length} área(s) diferenciadas por color y declaradas en la simbología.`);
  const escal = nodos.filter(n => desnivelDe(n.id) > 0);
  if(escal.length){
    W(`${escal.length} unidad(es) escalonadas respecto de sus pares (${escal.slice(0,3).map(n => esc(n.titulo)).join(", ")}).
      Comunica antigüedad o grado, pero la lectura normativa asocia la <b>altura al nivel jerárquico</b>: para un estatuto
      o un manual conviene expresar esa diferencia como <b>unidad de apoyo</b> (asesoría adosada) o como subordinación real.`);
    const off = Math.max.apply(null, escal.map(n => desnivelDe(n.id))) * c.pasoDesnivel;
    if(off > (c.h + c.gapN)/2) E(`El escalonado llega a ${off} px y se lee como un nivel jerárquico distinto.
      Reduce el "Paso del escalonado" o cuelga esa unidad de quien realmente la supervisa.`);
  } else if(!realineadas.length) G("Niveles jerárquicos alineados: la altura corresponde al nivel.");
  G("Cajas de dimensión uniforme: el tamaño no indica jerarquía.");
  G("Líneas de mando sin flechas descendentes y de grosor constante en todos los niveles.");
  G("Cada jefe conecta a sus subordinados con una sola línea.");
  return A;
}
function lum(hex){
  const h = hex.replace("#","");
  const v = [0,2,4].map(i => {
    let x = parseInt(h.length===3 ? h[i/2]+h[i/2] : h.slice(i,i+2), 16)/255;
    return x <= .03928 ? x/12.92 : Math.pow((x+.055)/1.055, 2.4);
  });
  return .2126*v[0] + .7152*v[1] + .0722*v[2];
}
function contraste(a, b){
  const l1 = lum(a), l2 = lum(b);
  return (Math.max(l1,l2) + .05) / (Math.min(l1,l2) + .05);
}

function irAnio(a){
  S.cfg.anio = a;
  if(sel && !visibleEn(sel, a)) sel = null;
  refresh();
  status(a > anioBase() ? `Viendo ${a}: organigrama propuesto` : `Viendo ${a}: estructura vigente`);
}
function agregarAnio(){
  snap();
  const A = aniosOrd();
  S.cfg.anios = A.concat([A[A.length-1] + 1]);
  irAnio(A[A.length-1] + 1);
}
function quitarAnio(){
  const A = aniosOrd();
  if(A.length < 2) return;
  const ult = A[A.length-1];
  const usan = Object.values(S.nodes).filter(n => +n.desde === ult || +n.hasta === ult || (n.plazasAnio||{})[String(ult)] != null).length;
  if(usan && !confirm(`${usan} unidad(es) tienen datos de ${ult}. ¿Quitar el año igual? Los datos de ${ult} se pierden.`)) return;
  snap();
  S.cfg.anios = A.slice(0, -1);
  Object.values(S.nodes).forEach(n => {
    if(+n.desde === ult) n.desde = null;
    if(+n.hasta === ult) n.hasta = null;
    if(n.plazasAnio) delete n.plazasAnio[String(ult)];
  });
  irAnio(S.cfg.anios[S.cfg.anios.length-1]);
}
function exportCSV(){
  layout();
  const A = aniosOrd();
  const q = t => `"${String(t==null?"":t).replace(/"/g,'""')}"`;
  const L = [["Nivel","Banda visual","Area","Unidad","Tipo","Depende de","Categoria de cargo",
    "Existe desde","Baja en"].concat(A.map(a => "Personas " + a)).concat(["Total del area " + anioAct(),"Titular"]).join(";")];
  const prof = {};
  (function walk(id, d){ prof[id] = d; kidsAll(id).forEach(k => walk(k.id, d+1)); })(S.root, 0);
  const ordenados = Object.keys(S.nodes).sort((a,b) =>
    (prof[a] - prof[b]) || ((P[a] ? P[a].x : 0) - (P[b] ? P[b].x : 0)));
  ordenados.forEach(id => {
    const n = S.nodes[id], p = P[id], ar = areaDe(id);
    L.push([ prof[id] + 1,
      q(p ? ((S.cfg.bandas[p.b] || "").trim() || ("Nivel " + ((p.b||0)+1))) : "no existe en " + anioAct()),
      q(ar ? ar.titulo : ""), q(n.titulo), q(TIPOS[n.tipo].nom),
      q(n.parent ? (S.nodes[n.parent]||{}).titulo : "—"), q(n.categoria || ""),
      n.desde || A[0], n.hasta || "" ]
      .concat(A.map(a => visibleEn(id, a) ? (plazasEn(n, a) == null ? "" : plazasEn(n, a)) : ""))
      .concat([ p ? totalArea(id) : "", q(n.titular || "") ]).join(";"));
  });
  const tot = A.map(a => { const guarda = S.cfg.anio; S.cfg.anio = a; const t = totalGeneral(); S.cfg.anio = guarda; return t; });
  L.push(["", "", "", q("TOTAL"), "", "", "", "", ""].concat(tot).concat(["", ""]).join(";"));
  bajar(slug() + "-padron.csv", new Blob(["﻿" + L.join("\r\n")], { type:"text/csv;charset=utf-8" }));
  status("Padrón exportado en CSV con una columna por año");
}

/* ============================== OPERACIONES ============================== */
function agregar(tipo, comoHermana){
  const base = sel && S.nodes[sel] ? S.nodes[sel] : S.nodes[S.root];
  let padre = base.id;
  if(comoHermana && base.parent) padre = base.parent;
  if(!TIPOS[tipo].arbol && !comoHermana){
    /* consejos y comisiones se adscriben al órgano de dirección */
    if(["consejo","comision","comisionIS"].indexOf(tipo) >= 0){
      const p = P[padre];
      if(p && p.d > 1){ padre = S.root; status("Adscrito al órgano de dirección, como pide la norma"); }
    }
  }
  snap();
  const id = uid();
  const n = nodo(id, padre, tipo, "Nueva unidad", kidsAll(padre).length);
  if(anioAct() > anioBase()) n.desde = anioAct();   /* nace en el año que estás viendo */
  if(!TIPOS[tipo].arbol) n.lado = kidsSide(padre).filter(x => x.lado === "L").length
    > kidsSide(padre).filter(x => x.lado === "R").length ? "R" : "L";
  S.nodes[id] = n;
  sel = id;
  refresh();
  const f = $("#fTit"); if(f){ f.focus(); f.select(); }
}
function duplicar(){
  if(!sel || !S.nodes[sel] || !S.nodes[sel].parent) return;
  snap();
  const o = S.nodes[sel], id = uid();
  S.nodes[id] = Object.assign(clone(o), { id, ord:o.ord + .5 });
  normalizarOrden(o.parent);
  sel = id; refresh();
}
function borrar(){
  if(!sel || !S.nodes[sel] || !S.nodes[sel].parent) return;
  const hijos = descendientes(sel);
  if(hijos.length && !confirm(`Se eliminará "${S.nodes[sel].titulo}" y ${hijos.length} unidad(es) dependiente(s). ¿Continuar?`)) return;
  snap();
  const p = S.nodes[sel].parent;
  hijos.concat([sel]).forEach(id => { delete S.nodes[id]; });
  S.rel = S.rel.filter(r => S.nodes[r.a] && S.nodes[r.b]);
  normalizarOrden(p);
  sel = p; refresh();
}
function mover(dir){
  if(!sel || !S.nodes[sel]) return;
  const n = S.nodes[sel];
  if(!n.parent) return;
  const h = kidsAll(n.parent), i = h.indexOf(n);
  const j = i + dir;
  if(j < 0 || j >= h.length) return;
  snap();
  const a = h[i].ord; h[i].ord = h[j].ord; h[j].ord = a;
  refresh();
}
function reasignar(id, nuevoPadre){
  if(id === nuevoPadre) return;
  if(!S.nodes[id].parent) { status("El órgano máximo no puede depender de otra unidad"); return; }
  if(descendientes(id).indexOf(nuevoPadre) >= 0) { status("No se puede colgar una unidad de su propia dependencia"); return; }
  snap();
  const viejo = S.nodes[id].parent;
  S.nodes[id].parent = nuevoPadre;
  S.nodes[id].ord = kidsAll(nuevoPadre).length;
  normalizarOrden(viejo); normalizarOrden(nuevoPadre);
  refresh();
  status(`"${S.nodes[id].titulo}" ahora depende de "${S.nodes[nuevoPadre].titulo}"`);
}

function slug(){
  return (S.meta.titulo || "organigrama").toLowerCase() + (aniosOrd().length > 1 ? "-" + anioAct() : "")
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60) || "organigrama";
}
function bajar(nombre, blob){
  const a = document.createElement("a"), u = URL.createObjectURL(blob);
  a.href = u; a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 400);
}
function guardarJSON(){

function abrirJSON(txt){
  try {
    const d = JSON.parse(txt);
    if(!d || !d.nodes || !d.root) throw new Error("formato");
    S = Object.assign(blankState(), d);
    S.cfg = Object.assign(blankState().cfg, d.cfg || {});
    S.meta = Object.assign(blankState().meta, d.meta || {});
    S.rel = d.rel || [];
    sel = null; undoStack = []; redoStack = [];
    refresh(); fitView(); status("Organigrama cargado");
  } catch(e){ alert("El archivo no es un organigrama válido (.org.json)."); }

function exportSVG(){
  bajar(slug() + ".svg", new Blob([svgString().svg], { type:"image/svg+xml;charset=utf-8" }));
  status("SVG vectorial exportado");
}
function exportPNG(){
  const pedida = +$("#selDpi").value;
  const r = svgString();
  /* los navegadores no dibujan canvas de más de ~16.384 px por lado ni de área
     ilimitada: si la escala pedida se pasa, se baja sola y se avisa */
  const LADO = 16000, AREA = 180e6;
  const tope = Math.min(LADO/r.w, LADO/r.h, Math.sqrt(AREA/(r.w*r.h)));
  const escala = Math.max(1, Math.min(pedida, Math.floor(tope*10)/10));
  if(escala < pedida) status(`Organigrama muy grande: PNG a ${escala}x en vez de ${pedida}x (usa SVG o PDF para calidad total)`);
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement("canvas");
    cv.width = Math.round(r.w * escala); cv.height = Math.round(r.h * escala);
    const ctx = cv.getContext("2d");
    ctx.fillStyle = S.cfg.colLienzo; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    cv.toBlob(b => {
      if(!b){ status("El PNG salió demasiado grande para el navegador: exporta en SVG o PDF"); return; }
      bajar(slug() + "-" + escala + "x.png", b);
      status(`PNG exportado ${cv.width}×${cv.height} px a ${escala}x`);
    });
  };
  img.onerror = () => status("No se pudo generar el PNG");
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(r.svg);
}

function status(t){ $("#statusMsg").textContent = t || ""; if(t) setTimeout(() => { if($("#statusMsg").textContent === t) $("#statusMsg").textContent = ""; }, 4200); }
function autosave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} }, 400);
}
function refresh(){
  _gate();
  renderCanvas(); renderAnios(); renderNode(); renderMeta(); renderPres(); renderColor(); renderPlaza(); renderAudit(); renderRels();
  $("#btUndo").disabled = !undoStack.length;
  $("#btRedo").disabled = !redoStack.length;

}
function fitView(){
  layout();
  const b = bboxTotal(), st = $("#stage").getBoundingClientRect();
  const z = Math.min(3, Math.max(.12, Math.min((st.width - 60)/Math.max(1,b.w), (st.height - 60)/Math.max(1,b.h))));
  S.view.z = z;
  S.view.x = (st.width - b.w*z)/2 - b.x*z;
  S.view.y = (st.height - b.h*z)/2 - b.y*z;
  renderCanvas();
}
function zoomTo(z, cx, cy){
  const st = $("#stage").getBoundingClientRect();
  const px = (cx == null ? st.width/2 : cx), py = (cy == null ? st.height/2 : cy);
  const v = S.view, nz = Math.min(3, Math.max(.12, z));
  v.x = px - (px - v.x) * (nz/v.z);
  v.y = py - (py - v.y) * (nz/v.z);
  v.z = nz;
  renderCanvas();
}
function aMundo(ev){
  const r = $("#svg").getBoundingClientRect(), v = S.view;
  return { x:(ev.clientX - r.left - v.x)/v.z, y:(ev.clientY - r.top - v.y)/v.z };
}
function nodoEn(pt, excluir){
  const ids = Object.keys(P).filter(id => S.nodes[id] && (!excluir || excluir.indexOf(id) < 0));
  for(let i = ids.length-1; i >= 0; i--){
    const p = P[ids[i]];
    if(pt.x >= p.x && pt.x <= p.x+p.w && pt.y >= p.y && pt.y <= p.y+p.h) return ids[i];
  }
  return null;
}
let pan = null, drag = null;
function initEventos(){
  const svg = $("#svg");
  svg.addEventListener("mousedown", ev => {
    if(ev.button !== 0) return;
    const pt = aMundo(ev), id = nodoEn(pt);
    if(coordMode){
      if(!id) return;
      if(!coordFrom){ coordFrom = id; status("Ahora clic en la segunda unidad"); }
      else if(coordFrom !== id){
        snap(); S.rel.push({ a:coordFrom, b:id, tipo:"coord" });
        coordFrom = null; setCoord(false); refresh(); status("Relación de coordinación agregada");
      }
      return;
    }
    if(id){
      sel = id; renderNode(); renderCanvas();
      drag = { id, x0:ev.clientX, y0:ev.clientY, activo:false, excluir:[id].concat(descendientes(id)) };
    } else {
      sel = null; renderNode(); renderCanvas();
      pan = { x:ev.clientX, y:ev.clientY, vx:S.view.x, vy:S.view.y };
      svg.classList.add("panning");
    }
  });
  window.addEventListener("mousemove", ev => {
    if(pan){
      S.view.x = pan.vx + (ev.clientX - pan.x);
      S.view.y = pan.vy + (ev.clientY - pan.y);
      renderCanvas();
      return;
    }
    if(drag){
      if(!drag.activo && Math.abs(ev.clientX-drag.x0) + Math.abs(ev.clientY-drag.y0) < 5) return;
      drag.activo = true;
      const g = document.querySelector(`.nd[data-id="${drag.id}"]`);
      if(g) g.classList.add("drag");
      const t = nodoEn(aMundo(ev), drag.excluir);
      document.querySelectorAll(".nd.tgt").forEach(e => e.classList.remove("tgt"));
      if(t){
        const e = document.querySelector(`.nd[data-id="${t}"]`);
        if(e) e.classList.add("tgt");
      }
      drag.target = t;
      $("#hud").textContent = t ? `Soltar para que dependa de "${S.nodes[t].titulo}"` : "Suelta sobre una unidad para cambiar de jefe";
    }
  });
  window.addEventListener("mouseup", () => {
    if(pan){ pan = null; $("#svg").classList.remove("panning"); }
    if(drag){
      const d = drag; drag = null;
      if(d.activo && d.target) reasignar(d.id, d.target);
      else refresh();
    }
  });
  svg.addEventListener("dblclick", ev => {
    const id = nodoEn(aMundo(ev));
    if(!id) return;
    sel = id; renderNode(); renderCanvas();
    const f = $("#fTit"); if(f){ f.focus(); f.select(); }
  });
  svg.addEventListener("wheel", ev => {
    ev.preventDefault();
    const r = $("#stage").getBoundingClientRect();
    zoomTo(S.view.z * (ev.deltaY < 0 ? 1.12 : .89), ev.clientX - r.left, ev.clientY - r.top);
  }, { passive:false });

  document.addEventListener("keydown", ev => {
    const t = ev.target.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT"){
      if(ev.key === "Escape") ev.target.blur();
      return;
    }
    if(ev.ctrlKey && (ev.key === "z" || ev.key === "Z")){ ev.preventDefault(); undo(); return; }
    if(ev.ctrlKey && (ev.key === "y" || ev.key === "Y")){ ev.preventDefault(); redo(); return; }
    if(ev.ctrlKey && (ev.key === "s" || ev.key === "S")){ ev.preventDefault(); guardarJSON(); return; }
    if(ev.key === "Delete"){ ev.preventDefault(); borrar(); return; }
    if(ev.key === "Tab"){ ev.preventDefault(); agregar("linea", false); return; }
    if(ev.key === "Enter"){ ev.preventDefault(); agregar("linea", true); return; }
    if(ev.key === "Escape"){
      if($("#ovl")) { closeModal(); return; }
      setCoord(false); sel = null; refresh();
    }
  });
  window.addEventListener("resize", () => renderCanvas());
  setInterval(() => { if(Date.now() - _lastGate > 60000){ _lastGate = Date.now(); _gate(); } }, 15000);
}
function setCoord(on){
  coordMode = on; coordFrom = null;
  $("#btCoord").classList.toggle("on", on);
  $("#svg").classList.toggle("link", on);
  if(on) status("Clic en la primera unidad");
}
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  $("#btTheme").textContent = t === "dark" ? "Modo claro" : "Modo oscuro";
  try { localStorage.setItem(LS_THEME, t); } catch(e){}
}

/* ================================= EJEMPLO =============================== */
function demo(){
  const s = blankState();
  s.nodes = {};
  s.meta = { titulo:"Organigrama de puestos y plazas", subtitulo:"Organización Ejemplo",
             unidad:"Unidad de Planificación", fecha:hoy(), aprobado:"Asamblea General",
             ambito:"general", contenido:"puestos", nota:"" };
  s.cfg.resumenNivel = 3;
  let i = 0;
  const add = (titulo, parent, tipo, lado, personas, categoria) => {
    const id = "d" + (++i);
    s.nodes[id] = Object.assign(nodo(id, parent, tipo || "linea", titulo, i),
      lado ? { lado } : {}, { personas: personas == null ? null : personas, categoria: categoria || "" });
    return id;
  };
  const asam = add("Asamblea General", null, null, null, null, "Directivo");
  s.root = asam;
  const dir = add("Directorio", asam, null, null, 7, "Directivo");
  add("Consejo Consultivo", dir, "consejo", "R", 5, "Directivo");
  add("Comisión de Ética", dir, "comision", "L", 3, "Directivo");
  const eje = add("Dirección Ejecutiva", dir, null, null, 1, "Directivo");
  add("Asesoría Jurídica", eje, "staffInt", "L", 2, "Asesoría");
  add("Auditoría Interna", eje, "staffExt", "R", 2, "Asesoría");
  const adm = add("Gestión Administrativa Financiera", eje, null, null, 1, "Administrativo");
  add("Contabilidad", adm, null, null, 3, "Administrativo");
  add("Tesorería", adm, null, null, 2, "Administrativo");
  add("Talento Humano", adm, null, null, 2, "Administrativo");
  const ope = add("Gestión de Operaciones", eje, null, null, 1, "Operativo");
  add("Logística", ope, null, null, 4, "Operativo");
  add("Mantenimiento", ope, null, null, 6, "Operativo");
  add("Gestión de Comunicación", eje, null, null, 2, "Administrativo");
  add("Sede Norte", eje, "desconc", null, 8, "Operativo");
  return s;
}

/* ================================= ARRANQUE ============================== */
function init(){
  renderPalette();
  initEventos();
  $("#btNew").onclick = () => { if(confirm("¿Empezar un organigrama en blanco?")){ S = blankState(); sel = S.root; undoStack = []; redoStack = []; refresh(); fitView(); } };
  $("#btDemo").onclick = () => { snap(); S = demo(); sel = null; refresh(); fitView(); status("Organigrama de ejemplo cargado"); };
  $("#btOpen").onclick = () => $("#fileIn").click();
  $("#fileIn").onchange = ev => {
    const f = ev.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => abrirJSON(r.result);
    r.readAsText(f); ev.target.value = "";
  };
  $("#btSave").onclick = guardarJSON;
  $("#btSvg").onclick = exportSVG;
  $("#btCsv").onclick = exportCSV;
  $("#selAnio").onchange = e => irAnio(+e.target.value);
  $("#btAnioMas").onclick = agregarAnio;
  $("#btPng").onclick = exportPNG;
  $("#btPrint").onclick = imprimir;
  $("#btUndo").onclick = undo;
  $("#btRedo").onclick = redo;
  $("#btFit").onclick = fitView;
  $("#btZoomIn").onclick = () => zoomTo(S.view.z * 1.15);
  $("#btZoomOut").onclick = () => zoomTo(S.view.z * .87);
  $("#btCoord").onclick = () => setCoord(!coordMode);
  $("#btGuia").onclick = () => modal("Reglas para elaborar organigramas", normativaHTML());
  $("#btAbout").onclick = () => modal("Acerca de " + APP.nombre, acercaHTML());
  $("#btTheme").onclick = () => setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  $("#foot").innerHTML = `<b>${APP.nombre}</b> ${APP.version} &middot; ${APP.marca}<br><a href="mailto:${APP.email}">${APP.email}</a>`;

  let th = "light";
  try { th = localStorage.getItem(LS_THEME) || "light"; } catch(e){}
  setTheme(th);

  let cargado = false;
  try {
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && d.nodes && d.root){
        S = Object.assign(blankState(), d);
        S.cfg = Object.assign(blankState().cfg, d.cfg || {});
        S.meta = Object.assign(blankState().meta, d.meta || {});
        cargado = true;
      }
    }
  } catch(e){}
  if(!cargado) S = demo();
  _gate();
  refresh();
  fitView();
}
init();
</script>
